[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-agent"
version = "0.0.1"
description = "A minimal, verifiable coding agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    # .env 解析。**运行期依赖**（CLI 读密钥要用），不是 dev 依赖。
    #
    # 2026-09-20 更正：我第一版自己写了约 20 行解析器，理由是"能不新增依赖
    # 就不新增"。**那是个判断错误**——那条原则的适用场景是"新增依赖会带来
    # 实质代价"（当时拒 OpenAI SDK，是因为它藏起了本批次要验证的协议细节）。
    # python-dotenv 是纯 Python、零传递依赖，且 .env 解析不是本项目的核心能力。
    #
    # 代价核算：自写版本 20 行代码 + 18 个测试，覆盖面仍不如成熟库——
    # **那个成本已经超过依赖本身**。
    "python-dotenv>=1.0",
    # 终端渲染（P4-批次6，Q2 拍板：运行期依赖）。CLI 是产品面，
    # optional extra 会让"有 rich / 没 rich"两套渲染路径漂移。
    # 验证：venv Python 3.13.9 + rich 15.0.0 实测正常；rich 官方支持 ≥3.9。
    # 代价核算：传递引入 markdown-it-py + pygments，纯 Python 无编译。
    "rich>=13",
    # 终端按键输入(P3-批次2 追加,星辰:决策交互按键化)。跨平台按键归一化
    # (Windows 老 conhost 的方向键/VT 转义)是最容易写错的部分,交给它扛;
    # 传递依赖仅 wcwidth,纯 Python。
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[project.scripts]
sigma = "sigma.cli.main:main"

# 唯一顶层包 sigma 放在 src/ 下(P6 目录重构,星辰拍板 Q1:标准 src 布局)。
# 旧布局(core/ 下五个 sigma_* 平级包)已废,见 docs/plans/P6-目录结构重构-详规.md。
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 注意：这里**不写** `pythonpath = [...]`。
# 那个选项来自 `pytest-pythonpath` 插件，本项目**没装**（装了也不生效，
# 而症状是"配置写了但没用"——正是"名义门槛"）。
# 路径注入统一由 `tests/conftest.py` 用 stdlib 做，见该文件顶部说明。

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
# **钉住目标平台 = CI 的平台**（2026-09-22 加）。
#
# mypy 默认按"运行它的那台机器"选平台相关的 stub，于是同一份代码
# 在本地（Windows）与 CI（ubuntu-latest）上可能给出不同结论：
# 第一次跑 CI 就栽在这上面——`cli.py` 里一条为 Windows 写的
# `# type: ignore[union-attr]` 在 Linux 上成了"多余注释"，
# strict 的 `warn_unused_ignores` 直接把它报成错误（安装与契约都过了，mypy 挂）。
#
# 钉住之后的性质：**本地 `mypy src` 与 CI 完全同口径**，
# "本地绿 → 推上去红"这类差异不再出现。
platform = "linux"

# 三道门禁 = lint-imports / mypy / pytest。
#
# ruff 已于 2026-09-20 移除（本人决定：追求大道至简，不必要的功能不要）。
# 移除理由不只是"少一个工具"：ruff **从未进 CI**，
# 却在 P1-批次1.5-详规 的 G19 里被列为门槛——
# 那是"声明的门槛大于实际执行的门槛"，属于名义约束。
# 与其留一个名义门槛，不如删掉。

# 分层依赖契约。P6 目录重构后:单顶层包 sigma,按功能域子包分层,
# 列表自上而下 = 由高到低,低层不允许引用高层。
# (旧的"内置工具与会话层互不依赖"independence 契约随旧布局废除——
#  它只为钉住 sigma_tools/sigma_session 兄弟关系而存在,
#  新结构里 tools 与 sessions 相隔多层,无歧义。)
[tool.importlinter]
root_packages = ["sigma"]
# evals / extensions 不在 root_packages 里（它们不是被安装的包），
# 但下面第二条契约要禁止核心包引用它们，所以必须打开这个开关。
include_external_packages = true

[[tool.importlinter.contracts]]
name = "分层只允许向下依赖"
type = "layers"
layers = [
    "sigma.cli",
    "sigma.sdk",
    "sigma.observability",
    "sigma.runtime",
    "sigma.tools",
    "sigma.skills",
    "sigma.security",
    "sigma.hooks",
    "sigma.sessions",
    "sigma.memory",
    "sigma.events",
    "sigma.agent",
    "sigma.prompts",
    "sigma.config",
    "sigma.providers",
    # sigma.team:P4 团队任务协作域(状态机/存储/信箱,详规 §2.0)——
    # 纯 stdlib、零 sigma 内部依赖,放在最底层区,任何上层可向下引用它。
    "sigma.team",
]

[[tool.importlinter.contracts]]
name = "核心包不得依赖评测与扩展"
type = "forbidden"
source_modules = [
    "sigma",
]
forbidden_modules = [
    "evals",
    "extensions",
]
